logging:
  config: classpath:log4j2.xml

spring:
  main:
    web-application-type: none

  application:
    name: notificacaoapi

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL:false}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jackson:
    deserialization:
      fail-on-unknown-properties: true

  jpa:
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true

app:
  mail:
    from: ${MAIL_FROM:naoresponda@hospital.fiap.br}
    assunto-consulta-criada: "Consulta agendada com sucesso"
    assunto-consulta-atualizada: "Sua consulta foi remarcada"

---

spring:
  config:
    activate:
      on-profile: dev

  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

---

spring:
  config:
    activate:
      on-profile: prod

---

spring:
  config:
    activate:
      on-profile: test

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:fiap}
    password: ${RABBITMQ_PASSWORD:fiap@2026}

  mail:
    host: ${MAIL_HOST:localhost}
    username: ${MAIL_USERNAME:teste}
    password: ${MAIL_PASSWORD:teste}
---
app:
  mail:
    from: ${MAIL_FROM:naoresponda@hospital.fiap.br}
    assunto-consulta-criada: "Consulta agendada com sucesso"
    assunto-consulta-atualizada: "Sua consulta foi remarcada"
    assunto-lembrete-consulta: "Lembrete: sua consulta é amanhã"