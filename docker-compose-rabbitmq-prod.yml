name: fiap-fase3

services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq-fase3

    environment:
      TZ: America/Sao_Paulo

      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?defina RABBITMQ_USERNAME no arquivo .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?defina RABBITMQ_PASSWORD no arquivo .env}

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: always

    networks:
      - shared-net

volumes:
  rabbitmq-data:
    name: fiap-rabbitmq-data

networks:
  shared-net:
    name: shared-net
